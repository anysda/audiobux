# The images are built by GitHub Actions from main (.github/workflows/images.yml)
# and published to ghcr.io/anysda/audiobux; install.sh pulls the ones of the latest release
# and runs them by the digest CI built them with (AUDIOBUX_*_DIGEST in .env).
# Two of them, one per process. The worker voices the queue on the video card and
# holds everything under the data folder; the web process only takes uploads into
# incoming/, reads the library, keeps where the listener is in web/ and asks the
# worker on its socket in run/.
# The data folder on the host is AUDIOBUX_DATA (./data by default); both
# processes run as AUDIOBUX_UID:AUDIOBUX_GID, the owner of that folder. The web
# answers on AUDIOBUX_PORT (8080) of the address AUDIOBUX_BIND (127.0.0.1: this machine
# only), HTTPS only, with the certificate install.sh makes in tls/. install.sh puts
# them all into .env.
x-hardened: &hardened
  restart: unless-stopped
  user: "${AUDIOBUX_UID:-1000}:${AUDIOBUX_GID:-1000}"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  # Puts in place what the worker runs on, the runtime and the models, into the data
  # folder and exits: the only one of the image with a way out, the worker has none.
  # It runs in the background, how far it is goes to models/.fetched/progress.json and
  # from the worker to the interface; ./install.sh starts it again after a failure.
  fetch:
    <<: *hardened
    image: ghcr.io/anysda/audiobux/worker@${AUDIOBUX_WORKER_DIGEST:?нет digest образа, запустите ./install.sh}
    container_name: audiobux-fetch
    restart: "no"
    command: ["audiobux", "fetch"]
    # what decides the models, as the worker has it
    environment:
      AUDIOBUX_DATA: /data
      AUDIOBUX_TTS: f5
    networks: [default]
    volumes:
      - ${AUDIOBUX_DATA:-./data}:/data

  worker:
    <<: *hardened
    image: ghcr.io/anysda/audiobux/worker@${AUDIOBUX_WORKER_DIGEST:?нет digest образа, запустите ./install.sh}
    container_name: audiobux-worker
    command: ["audiobux", "worker"]
    environment:
      AUDIOBUX_DATA: /data
      AUDIOBUX_TTS: f5
      AUDIOBUX_QUIET_HOURS: ${AUDIOBUX_QUIET_HOURS:-}
      AUDIOBUX_COVER_URL: http://cover:8080
      # the models are on disk, put there by fetch; no loader asks the hub
      HF_HUB_OFFLINE: "1"
    # starts at once, so that the interface is up meanwhile, and takes the first book once
    # fetch has put the models in place; a dependency on fetch's exit would hold
    # `docker compose up -d` for the whole download
    # no way out: covers are asked of the cover service, the web process is on the socket
    networks: [cover_in]
    volumes:
      - ${AUDIOBUX_DATA:-./data}:/data
      # quiet hours and the log run by the host's clock and time zone
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/worker.sock"]
      interval: 10s
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    <<: *hardened
    image: ghcr.io/anysda/audiobux/web@${AUDIOBUX_WEB_DIGEST:?нет digest образа, запустите ./install.sh}
    container_name: audiobux-web
    command: ["audiobux", "web", "--port", "8080", "--tls", "/data/tls"]
    environment:
      AUDIOBUX_DATA: /data
      # off: no sign-in, for a reverse proxy in front that signs in itself
      AUDIOBUX_LOGIN: ${AUDIOBUX_LOGIN:-on}
      # names the service is opened by besides its IP addresses, comma-separated
      AUDIOBUX_HOSTS: ${AUDIOBUX_HOSTS:-}
      AUDIOBUX_UPLOAD_MB: ${AUDIOBUX_UPLOAD_MB:-1024}
      AUDIOBUX_QUEUE_MAX: ${AUDIOBUX_QUEUE_MAX:-20}
      AUDIOBUX_MIN_FREE_GB: ${AUDIOBUX_MIN_FREE_GB:-5}
    # the worker makes the folders and the socket first
    depends_on:
      worker:
        condition: service_healthy
    ports: ["${AUDIOBUX_BIND:-127.0.0.1}:${AUDIOBUX_PORT:-8080}:8080"]
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 64
    volumes:
      - ${AUDIOBUX_DATA:-./data}/incoming:/data/incoming
      - ${AUDIOBUX_DATA:-./data}/library:/data/library:ro
      - ${AUDIOBUX_DATA:-./data}/run:/data/run
      - ${AUDIOBUX_DATA:-./data}/web:/data/web
      - ${AUDIOBUX_DATA:-./data}/tls:/data/tls:ro
      - /etc/localtime:/etc/localtime:ro

  # Cover search on the web, isolated: author and title in, image bytes out.
  # No secrets, no volumes, no GPU; outside network only. The finder goes only to the
  # hosts on its list, and its bridge has a fixed name, br-cover-out, so that a firewall
  # on the host can drop it to private ranges and to the host as well.
  cover:
    image: ghcr.io/anysda/audiobux/cover@${AUDIOBUX_COVER_DIGEST:?нет digest образа, запустите ./install.sh}
    container_name: audiobux-cover
    restart: unless-stopped
    networks: [cover_in, cover_out]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65534:65534"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

networks:
  # fetch's way out
  default: {}
  # the web process answers on its port and goes nowhere itself
  web:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  cover_in:
    internal: true
  cover_out:
    driver_opts:
      com.docker.network.bridge.name: br-cover-out
