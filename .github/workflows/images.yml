name: images

on:
  push:
    branches: [main]
    # выпуск: образы под тегом выпуска и их digest в images.txt при выпуске на GitHub
    tags: ['v*']

permissions:
  contents: read
  packages: write

# Прогоны по очереди: прогон старого коммита, закончив позже, перетёр бы
# latest образом старого коммита.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            context: .
            target: worker
          - name: web
            context: .
            target: web
          # Поиск обложек в сети, отдельный контейнер без данных.
          - name: cover
            context: coverfinder
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v<версия> - выпуск, его ставит install.sh; latest - последний main;
      # sha-<коммит> - каждый коммит.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: smoke/${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}

      # Образ, который не стартует, в реестр не уезжает: install.sh стянет его.
      - name: smoke worker
        if: matrix.name == 'worker'
        run: docker run --rm smoke/worker python -c "import audiobux.worker, audiobux.pipeline"

      - name: smoke web
        if: matrix.name == 'web'
        run: |
          docker run --rm smoke/web python -c "import audiobux.web"
          docker run --rm smoke/web test -f /app/static/index.html

      - name: smoke cover
        if: matrix.name == 'cover'
        run: >
          docker run --rm smoke/cover python -I -c
          "import ast; ast.parse(open('/app/finder.py').read())"

      - name: push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Digest в аннотации: по ней сверяют то, что стянула машина, с тем, что собрали.
      - name: digest
        run: echo "::notice title=${{ matrix.name }}:${{ steps.meta.outputs.version }}::${{ steps.push.outputs.digest }}"

      - name: save digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: printf '%s %s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > "$IMAGE_NAME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: ${{ matrix.name }}.txt

  # images.txt при выпуске: install.sh тянет образы по тегу выпуска и берёт только
  # с этими digest, так подмена под тем же тегом в реестре не запускается.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: images.txt
        run: |
          cat digests/worker.txt digests/web.txt digests/cover.txt > images.txt
          [ "$(grep -cE '^(worker|web|cover) sha256:[0-9a-f]{64}$' images.txt)" = 3 ]
          cat images.txt
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" images.txt --clobber
