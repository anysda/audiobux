name: checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - name: svelte-check
        run: npm --prefix frontend run check
      - name: eslint
        run: npm --prefix frontend run lint
      - name: vitest
        run: npm --prefix frontend test
      - name: сборка
        run: npm --prefix frontend run build

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "ruff>=0.15"
      - run: ruff check
      - run: ruff format --check

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[dev]"
      - run: mypy

  vulture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "vulture>=2.14"
      - run: vulture

  # Границы пакета проверяются без зависимостей: импорты читаются из исходников.
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "pytest>=8"
      - run: pytest --noconftest -o addopts="" tests/test_imports.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: ffmpeg, djvulibre и shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg djvulibre-bin shellcheck
      - run: pip install ".[test]"
      - name: тесты с покрытием
        run: pytest
