stages: [lint, types, deadcode, imports, test]

default:
  image: python:3.12-slim
  cache:
    key: pip
    paths: [.cache/pip]

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

frontend:
  stage: lint
  image: node:22.22.3-slim
  cache:
    key: npm
    paths: [.cache/npm]
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  script:
    - npm --prefix frontend ci --no-audit --no-fund
    - npm --prefix frontend run check
    - npm --prefix frontend run lint
    - npm --prefix frontend run build

ruff:
  stage: lint
  script:
    - pip install "ruff>=0.15"
    - ruff check
    - ruff format --check

mypy:
  stage: types
  script:
    - pip install ".[dev]"
    - mypy

vulture:
  stage: deadcode
  script:
    - pip install "vulture>=2.14"
    - vulture

imports:
  stage: imports
  script:
    - pip install "pytest>=8"
    - pytest --noconftest -o addopts="" tests/test_imports.py

pytest:
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg djvulibre-bin
    - pip install ".[test]"
    - pytest
  coverage: '/^TOTAL.*\s(\d+%)$/'
