stages: [lint, types, deadcode, imports, test]

default:
  image: python:3.12-slim
  cache:
    key: pip
    paths: [.cache/pip]

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

ruff:
  stage: lint
  script:
    - pip install "ruff>=0.15"
    - ruff check
    - ruff format --check

mypy:
  stage: types
  script:
    - pip install ".[dev]"
    - mypy

vulture:
  stage: deadcode
  script:
    - pip install "vulture>=2.14"
    - vulture

imports:
  stage: imports
  script:
    - pip install "pytest>=8"
    - pytest --noconftest -o addopts="" tests/test_imports.py

pytest:
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg djvulibre-bin
    - pip install ".[test]"
    - pytest
  coverage: '/^TOTAL.*\s(\d+%)$/'
