[project]
name = "audiobux"
version = "0.5.0"
description = "Book file in, m4b audiobook out"
requires-python = ">=3.12"
# the settings, the socket contract and the list of formats need the standard library only
dependencies = []

[project.optional-dependencies]
# the web process: its image is these and the built interface (pylock.web.toml)
web = ["fastapi>=0.115", "uvicorn>=0.30"]
# what the worker imports when it starts: its image is these, ffmpeg and djvulibre (pylock.worker.toml)
worker = ["ebooklib>=0.18", "lxml>=5", "numpy>=1.26", "pillow>=10", "pymupdf>=1.24", "rapidfuzz>=3",
          "requests>=2.31", "soundfile>=0.12", "tqdm>=4.65"]
# what the models import on first use
models = ["faster-whisper>=1.2", "huggingface_hub>=0.30", "librosa>=0.10", "pymorphy3>=2", "ruaccent>=1.5.8",
          "rutextnorm>=2.1"]
# what F5-TTS 1.1.22 imports for inference; f5-tts itself comes without its own requirements (tool.uv below)
f5 = ["matplotlib>=3.7", "pydub>=0.25", "pypinyin>=0.50", "rjieba>=0.1", "safetensors>=0.4", "torch>=2.6",
      "torchaudio>=2.6", "torchcodec>=0.12", "torchdiffeq>=0.2", "tqdm>=4.65", "transformers>=4.40",
      "vocos>=0.1", "x-transformers>=1.31.14"]
# the models at the versions the service was tried with, CUDA from the wheels: the worker installs
# them into the data folder on its first start (pylock.runtime.toml, runtime.py). CTranslate2 under
# faster-whisper and llama-server are built for CUDA 12 and open its runtime and cuBLAS; torch brings 13.
# The locks, for Linux on x86_64, the worker's at the runtime's versions (bash):
#   O="--python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header"
#   uv pip compile pyproject.toml --extra runtime --extra worker $O -o pylock.runtime.toml
#   uv pip compile pyproject.toml --extra worker $O -o pylock.worker.toml \
#     -c <(uv pip compile pyproject.toml --extra runtime --extra worker $O -q --no-annotate)
#   uv pip compile pyproject.toml --extra web --python-version 3.12 \
#     --python-platform x86_64-unknown-linux-musl --no-header -o pylock.web.toml
runtime = ["audiobux[models,f5]", "f5-tts==1.1.22", "torch==2.15.0", "torchaudio==2.11.1", "torchcodec==0.17.0",
           "nvidia-cublas-cu12==12.9.*", "nvidia-cuda-runtime-cu12==12.9.*"]
test = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "audiobux[web,worker,models]"]
dev = ["audiobux[test]", "ruff>=0.15", "mypy>=1.15", "vulture>=2.14", "pre-commit>=4", "types-tqdm>=4.65"]

[project.scripts]
audiobux = "audiobux.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audiobux*"]

# F5-TTS's own requirements are the trainer's and the demo's (gradio, wandb, datasets,
# accelerate, bitsandbytes); triton is for torch.compile, which nothing here calls; PyMuPDF's
# are its layout analysis and Markdown export (ONNX Runtime and the rest), which nothing here calls
[tool.uv]
exclude-dependencies = ["triton"]

[[tool.uv.dependency-metadata]]
name = "f5-tts"
version = "1.1.22"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "pymupdf"
version = "2.1"
requires-dist = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]
# The texts are Russian: Cyrillic letters and typographic quotes and dashes are meant.
# RUF005 takes `rect + (dx0, dy0, dx1, dy1)` for tuple concatenation, but a PyMuPDF
# rect adds the 4-tuple to its corners, and the suggested `(*rect, ...)` breaks it.
ignore = ["RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["audiobux"]
split-on-trailing-comma = false

[tool.mypy]
files = ["audiobux"]
python_version = "3.12"
strict = true
# PyMuPDF is typed only in part
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["ebooklib.*", "f5_tts.*", "faster_whisper.*", "librosa.*", "pydub.*", "pymorphy3.*",
          "lxml.*", "rutextnorm.*", "ruaccent.*", "soundfile.*", "torchaudio.*", "torch.*"]
ignore_missing_imports = true

# transformers comes with ruaccent; its wrapped signatures are not checkable from here
[[tool.mypy.overrides]]
module = ["transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.vulture]
# the package only: a name the tests alone use is dead in the product
paths = ["audiobux"]
# attributes set for a library that reads them: ebooklib (an item's is_linear goes
# into the spine), sqlite3 (row_factory), requests (a session's auth) and socketserver
# (a handler's timeout and handle, a server's daemon_threads and request_queue_size),
# Starlette (a file answer's max_ranges, the status_code of the answer a route fills),
# the Hugging Face hub (its offline switch, see fetch.offline); and the fields
# of the answers in contract.py and web.py, which the other side of the socket and
# of the API reads
ignore_names = [
    "is_linear", "row_factory", "auth", "timeout", "handle", "daemon_threads", "request_queue_size",
    "max_ranges", "status_code",
    "HF_HUB_OFFLINE",
    "state", "pieces_done", "pieces_total", "percent", "added", "updated", "has_epub", "has_cover",
    "memory_used", "memory_total", "window", "active", "detail", "position", "listened",
]
# the routes of the web process: FastAPI calls them
ignore_decorators = ["@app.get", "@app.post", "@app.put", "@app.delete"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=audiobux --cov-report=term-missing:skip-covered"
