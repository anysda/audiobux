[project]
name = "audiobux"
version = "0.1.0"
description = "Book file in, m4b audiobook out"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.18",
    "faster-whisper>=1.2",
    "huggingface_hub>=0.30",
    "librosa>=0.10",
    "lxml>=5",
    "numpy>=1.26",
    "pillow>=10",
    "pymorphy3>=2",
    "pymupdf>=1.24",
    "rapidfuzz>=3",
    "requests>=2.31",
    "ruaccent>=1.5.8",
    "rutextnorm>=2.1",
    "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["audiobux[test]", "ruff>=0.15", "mypy>=1.15", "vulture>=2.14", "pre-commit>=4"]
# what F5-TTS 1.1.22 imports for inference; the image puts f5-tts itself on top with --no-deps
f5 = ["matplotlib>=3.7", "pydub>=0.25", "pypinyin>=0.50", "rjieba>=0.1", "safetensors>=0.4", "torch>=2.6",
      "torchaudio>=2.6", "torchcodec>=0.12", "torchdiffeq>=0.2", "tqdm>=4.65", "transformers>=4.40",
      "vocos>=0.1", "x-transformers>=1.31.14"]

[project.scripts]
audiobux = "audiobux.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audiobux*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]
# The texts are Russian: Cyrillic letters and typographic quotes and dashes are meant.
# RUF005 takes `rect + (dx0, dy0, dx1, dy1)` for tuple concatenation, but a PyMuPDF
# rect adds the 4-tuple to its corners, and the suggested `(*rect, ...)` breaks it.
ignore = ["RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["audiobux"]
split-on-trailing-comma = false

[tool.mypy]
files = ["audiobux"]
python_version = "3.12"
strict = true
# PyMuPDF is typed only in part
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["ebooklib.*", "f5_tts.*", "faster_whisper.*", "librosa.*", "pydub.*", "pymorphy3.*",
          "lxml.*", "rutextnorm.*", "ruaccent.*", "soundfile.*", "torchaudio.*", "torch.*"]
ignore_missing_imports = true

# transformers comes with ruaccent; its wrapped signatures are not checkable from here
[[tool.mypy.overrides]]
module = ["transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.vulture]
# the package only: a name the tests alone use is dead in the product
paths = ["audiobux"]
# attributes set for a library that reads them: ebooklib (an item's is_linear goes
# into the spine), sqlite3 (row_factory), requests (a session's auth) and socketserver
# (a handler's timeout and handle, a server's daemon_threads), Starlette (a file
# answer's max_ranges, the status_code of the answer a route fills); and the fields
# of the answers in contract.py and web.py, which the other side of the socket and
# of the API reads
ignore_names = [
    "is_linear", "row_factory", "auth", "timeout", "handle", "daemon_threads", "max_ranges", "status_code",
    "state", "pieces_done", "pieces_total", "percent", "added", "updated", "has_epub", "has_cover",
    "memory_used", "memory_total", "window", "active", "detail", "position", "listened",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=audiobux --cov-report=term-missing:skip-covered"
